name: Python checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install native video libraries
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0
      - name: Install application and development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify runtime dependency isolation
        run: python -c "import importlib.util; assert importlib.util.find_spec('tensorflow') is None"
      - name: Lint and formatting
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Regression tests
        run: python -m pytest -q
